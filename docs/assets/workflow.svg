<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <style>
      .wf-title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif; }
      .wf-text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif; }
      .wf-mono { font-family: 'SF Mono', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', monospace; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-light { fill: none; stroke: #d1fae5; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  
  <rect width="1200" height="500" fill="url(#bg)" rx="16"/>
  
  <text x="600" y="45" text-anchor="middle" fill="#fff" class="wf-title" font-size="22" font-weight="700">最大可用迁移工作流</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" class="wf-text" font-size="13">Maximum-Availability Migration Pipeline</text>
  
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="220" height="120" rx="12" fill="url(#grad1)"/>
    <text x="160" y="145" text-anchor="middle" fill="#fff" class="wf-title" font-size="15" font-weight="700">Phase 0 · 复制工作区</text>
    <text x="160" y="175" text-anchor="middle" fill="#e0f2fe" class="wf-mono" font-size="12">cp -R wechat-project</text>
    <text x="160" y="195" text-anchor="middle" fill="#e0f2fe" class="wf-text" font-size="12">创建迁移副本</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="320" y="110" width="220" height="120" rx="12" fill="url(#grad2)"/>
    <text x="430" y="145" text-anchor="middle" fill="#fff" class="wf-title" font-size="15" font-weight="700">Phase 1 · 扫描与审计</text>
    <text x="430" y="175" text-anchor="middle" fill="#ede9fe" class="wf-mono" font-size="12">scan_wechat_miniprogram.py</text>
    <text x="430" y="195" text-anchor="middle" fill="#ede9fe" class="wf-text" font-size="12">生成迁移审计报告</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="590" y="110" width="220" height="120" rx="12" fill="url(#grad3)"/>
    <text x="700" y="145" text-anchor="middle" fill="#fff" class="wf-title" font-size="15" font-weight="700">Phase 2-6 · 最大化迁移</text>
    <text x="700" y="175" text-anchor="middle" fill="#fef3c7" class="wf-mono" font-size="12">LOCALIZE · SNAPSHOT</text>
    <text x="700" y="195" text-anchor="middle" fill="#fef3c7" class="wf-mono" font-size="12">PRECOMPUTE · ADAPT</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="860" y="110" width="290" height="120" rx="12" fill="url(#grad4)"/>
    <text x="1005" y="145" text-anchor="middle" fill="#fff" class="wf-title" font-size="15" font-weight="700">Phase 9 · 严格验包</text>
    <text x="1005" y="175" text-anchor="middle" fill="#d1fae5" class="wf-mono" font-size="12">validate_xhs_minitool.py</text>
    <text x="1005" y="195" text-anchor="middle" fill="#d1fae5" class="wf-mono" font-size="12">build_xhs_zip.py</text>
    <path d="M980 195 L1040 195 L1033 190 M1040 195 L1033 200" class="arrow-light"/>
    <text x="1050" y="195" text-anchor="start" fill="#d1fae5" class="wf-mono" font-size="12">tool.zip</text>
  </g>
  
  <path d="M270 170 L320 170" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M540 170 L590 170" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M810 170 L860 170" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  
  <text x="600" y="290" text-anchor="middle" fill="#fff" class="wf-title" font-size="18" font-weight="700">10 级决策树 — 不到最后不 HARD_BLOCK</text>
  
  <g class="wf-text" font-size="11" font-weight="600">
    <rect x="70" y="320" width="90" height="36" rx="18" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="115" y="343" text-anchor="middle" fill="#7dd3fc">PRESERVE</text>
    
    <rect x="175" y="320" width="75" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="212" y="343" text-anchor="middle" fill="#c4b5fd">ADAPT</text>
    
    <rect x="265" y="320" width="95" height="36" rx="18" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.5"/>
    <text x="312" y="343" text-anchor="middle" fill="#f9a8d4">XHS BRIDGE</text>
    
    <rect x="370" y="320" width="95" height="36" rx="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="417" y="343" text-anchor="middle" fill="#fcd34d">LOCALIZE</text>
    
    <rect x="475" y="320" width="90" height="36" rx="18" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="520" y="343" text-anchor="middle" fill="#fca5a5">SNAPSHOT</text>
    
    <rect x="580" y="320" width="105" height="36" rx="18" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="632" y="343" text-anchor="middle" fill="#5eead4">PRECOMPUTE</text>
    
    <rect x="700" y="320" width="110" height="36" rx="18" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
    <text x="755" y="343" text-anchor="middle" fill="#86efac">EMULATE_LOCAL</text>
    
    <rect x="825" y="320" width="125" height="36" rx="18" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="887" y="343" text-anchor="middle" fill="#67e8f9">PRODUCT_REWRITE</text>
    
    <rect x="965" y="320" width="70" height="36" rx="18" fill="#64748b" fill-opacity="0.2" stroke="#64748b" stroke-width="1.5"/>
    <text x="1000" y="343" text-anchor="middle" fill="#cbd5e1">PROBE</text>
    
    <rect x="1055" y="320" width="100" height="36" rx="18" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1105" y="343" text-anchor="middle" fill="#fecaca">HARD_BLOCK</text>
  </g>
  
  <path d="M115 365 L115 385 L1105 385 L1105 365" stroke="#334155" stroke-width="2" fill="none"/>
  <circle cx="115" cy="385" r="4" fill="#0ea5e9"/>
  <circle cx="1105" cy="385" r="4" fill="#dc2626"/>
  
  <rect x="450" y="410" width="300" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="440" text-anchor="middle" fill="#e2e8f0" class="wf-mono" font-size="14" font-weight="700">tool.zip (offline · no network · no WASM)</text>
</svg>
