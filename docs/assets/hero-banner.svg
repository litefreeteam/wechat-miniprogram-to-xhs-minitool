<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
  <defs>
    <radialGradient id="bgCenter" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1b2e"/>
      <stop offset="50%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    
    <linearGradient id="bgSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07C160" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FF2442" stop-opacity="0.04"/>
    </linearGradient>
    
    <pattern id="fineGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3a5f" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    
    <filter id="greenGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="titleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="highwayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07C160" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2442" stop-opacity="0.6"/>
    </linearGradient>
    
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    
    <radialGradient id="greenOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3ef090"/>
      <stop offset="40%" stop-color="#07C160"/>
      <stop offset="100%" stop-color="#04783a"/>
    </radialGradient>
    
    <radialGradient id="redOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b80"/>
      <stop offset="40%" stop-color="#FF2442"/>
      <stop offset="100%" stop-color="#b31a2f"/>
    </radialGradient>
    
    <linearGradient id="wechatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ef090"/>
      <stop offset="100%" stop-color="#07C160"/>
    </linearGradient>
    
    <linearGradient id="xhsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b80"/>
      <stop offset="100%" stop-color="#FF2442"/>
    </linearGradient>
    
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd93e"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    
    <style>
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', monospace; }
      .label { font-family: 'SF Mono', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', monospace; }
      .arrow { fill: none; stroke: #00d4ff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  
  <!-- Base layers -->
  <rect width="1600" height="520" fill="url(#bgCenter)"/>
  <rect width="1600" height="520" fill="url(#bgSweep)"/>
  <rect width="1600" height="520" fill="url(#fineGrid)"/>
  
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="40%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1600" height="520" fill="url(#vignette)"/>
  
  <!-- Light beams -->
  <path d="M180 520 L520 0 L720 0 L380 520 Z" fill="#07C160" opacity="0.025"/>
  <path d="M880 520 L1220 0 L1420 0 L1080 520 Z" fill="#FF2442" opacity="0.025"/>
  <path d="M500 520 L760 0 L840 0 L580 520 Z" fill="#00d4ff" opacity="0.015"/>
  
  <!-- Floating hexagons in background -->
  <g stroke="#1e3a5f" stroke-width="1" fill="none" opacity="0.15">
    <path d="M120 80 L135 71 L150 80 L150 98 L135 107 L120 98 Z"/>
    <path d="M1400 100 L1418 90 L1436 100 L1436 120 L1418 130 L1400 120 Z"/>
    <path d="M130 400 L145 391 L160 400 L160 418 L145 427 L130 418 Z"/>
    <path d="M1450 380 L1465 371 L1480 380 L1480 398 L1465 407 L1450 398 Z"/>
  </g>
  
  <!-- Distant stars -->
  <g fill="#fff" opacity="0.25">
    <circle cx="120" cy="110" r="1.2"/>
    <circle cx="220" cy="440" r="0.9"/>
    <circle cx="420" cy="70" r="1.1"/>
    <circle cx="1180" cy="100" r="1.3"/>
    <circle cx="1380" cy="420" r="0.9"/>
    <circle cx="1480" cy="140" r="1.1"/>
    <circle cx="80" cy="260" r="0.8"/>
    <circle cx="1520" cy="320" r="1"/>
  </g>
  
  <!-- Highway glow -->
  <path d="M340 260 Q800 110 1260 260" stroke="url(#highwayGrad)" stroke-width="50" fill="none" opacity="0.12" filter="url(#cyanGlow)"/>
  <path d="M340 260 Q800 410 1260 260" stroke="url(#highwayGrad)" stroke-width="50" fill="none" opacity="0.08" filter="url(#cyanGlow)"/>
  
  <!-- Highway lanes -->
  <path d="M340 260 Q800 110 1260 260" stroke="url(#highwayGrad)" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M340 260 Q800 145 1260 260" stroke="#00d4ff" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="10 10"/>
  <path d="M340 260 Q800 375 1260 260" stroke="#00d4ff" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="10 10"/>
  <path d="M340 260 Q800 410 1260 260" stroke="url(#highwayGrad)" stroke-width="2.5" fill="none" opacity="0.6"/>
  
  <!-- WeChat icon -->
  <g transform="translate(280, 260)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="120" fill="#07C160" opacity="0.06" filter="url(#greenGlow)"/>
    <circle cx="0" cy="0" r="90" fill="url(#greenOrb)" opacity="0.12"/>
    
    <!-- Back bubble -->
    <path d="M-30 -55 C20 -80 70 -55 70 -5 C70 35 30 60 -10 60 C-18 60 -25 58 -32 55 L-55 75 L-48 48 C-72 35 -85 5 -85 -20 C-85 -52 -55 -72 -30 -55 Z" fill="#036d38" opacity="0.7"/>
    
    <!-- Front bubble -->
    <path d="M-50 -30 C-50 -80 15 -105 75 -80 C125 -58 145 -12 125 35 C110 70 70 90 25 90 C16 90 8 89 0 86 L-22 110 L-18 78 C-48 70 -72 42 -72 10 C-72 -10 -65 -25 -50 -30 Z" fill="url(#wechatGrad)"/>
    
    <!-- Eyes -->
    <ellipse cx="15" cy="-5" rx="11" ry="14" fill="#052e1a"/>
    <ellipse cx="70" cy="8" rx="11" ry="14" fill="#052e1a"/>
    <circle cx="20" cy="-10" r="4" fill="#fff" opacity="0.95"/>
    <circle cx="75" cy="3" r="4" fill="#fff" opacity="0.95"/>
    
    <!-- Smile -->
    <path d="M20 42 Q48 58 85 40" stroke="#052e1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Gloss -->
    <path d="M-30 -65 Q20 -85 65 -65" stroke="#fff" stroke-width="4" fill="none" opacity="0.25" stroke-linecap="round"/>
    
    <!-- Label -->
    <rect x="-52" y="115" width="104" height="30" rx="15" fill="url(#glassGrad)" stroke="#07C160" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="0" y="135" text-anchor="middle" fill="#3ef090" class="mono" font-size="13" font-weight="700">{ wechat }</text>
  </g>
  
  <!-- XHS book icon -->
  <g transform="translate(1320, 260)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="120" fill="#FF2442" opacity="0.06" filter="url(#redGlow)"/>
    <circle cx="0" cy="0" r="90" fill="url(#redOrb)" opacity="0.12"/>
    
    <!-- Book cover -->
    <rect x="-65" y="-90" width="130" height="180" rx="18" fill="url(#xhsGrad)"/>
    
    <!-- Book inner page area -->
    <rect x="-58" y="-83" width="116" height="166" rx="13" fill="#ff4d6d"/>
    
    <!-- Page indent for realism -->
    <rect x="-52" y="-77" width="104" height="154" rx="10" fill="#ff6b80" opacity="0.4"/>
    
    <!-- Page lines -->
    <rect x="-44" y="-60" width="88" height="11" rx="5.5" fill="#fff" opacity="0.95"/>
    <rect x="-44" y="-40" width="68" height="9" rx="4.5" fill="#fff" opacity="0.72"/>
    <rect x="-44" y="-24" width="76" height="9" rx="4.5" fill="#fff" opacity="0.72"/>
    <rect x="-44" y="-8" width="56" height="9" rx="4.5" fill="#fff" opacity="0.55"/>
    <rect x="-44" y="8" width="64" height="9" rx="4.5" fill="#fff" opacity="0.55"/>
    <rect x="-44" y="24" width="48" height="9" rx="4.5" fill="#fff" opacity="0.4"/>
    
    <!-- Bookmark -->
    <path d="M28 -90 L28 15 L38 5 L48 15 L48 -90 Z" fill="url(#bookmarkGrad)"/>
    
    <!-- Book shine -->
    <path d="M-48 -78 Q-15 -88 32 -83" stroke="#fff" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round"/>
    
    <!-- Label -->
    <rect x="-52" y="115" width="104" height="30" rx="15" fill="url(#glassGrad)" stroke="#FF2442" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="0" y="135" text-anchor="middle" fill="#ff6b80" class="mono" font-size="13" font-weight="700">H5 · ZIP</text>
  </g>
  
  <!-- Tech nodes -->
  <g filter="url(#softShadow)">
    <g transform="translate(540, 150)">
      <circle r="32" fill="url(#glassGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <text text-anchor="middle" y="5" fill="#00d4ff" class="label" font-size="15" font-weight="700">&lt;/&gt;</text>
    </g>
    
    <g transform="translate(690, 205)">
      <circle r="32" fill="url(#glassGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <text text-anchor="middle" y="5" fill="#00d4ff" class="label" font-size="14" font-weight="700">ZIP</text>
    </g>
    
    <g transform="translate(790, 340)">
      <circle r="32" fill="url(#glassGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <text text-anchor="middle" y="5" fill="#00d4ff" class="label" font-size="13" font-weight="700">Canvas</text>
    </g>
    
    <g transform="translate(990, 165)">
      <circle r="32" fill="url(#glassGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <text text-anchor="middle" y="5" fill="#00d4ff" class="label" font-size="14" font-weight="700">SPA</text>
    </g>
  </g>
  
  <!-- Animated particles -->
  <circle cx="400" cy="200" r="5" fill="#07C160" filter="url(#greenGlow)">
    <animate attributeName="cx" values="400;500;400" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;150;200" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="620" cy="320" r="6" fill="#00d4ff" filter="url(#cyanGlow)">
    <animate attributeName="cx" values="620;780;620" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="320;370;320" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="880" cy="190" r="5" fill="#00d4ff" filter="url(#cyanGlow)">
    <animate attributeName="cx" values="880;1080;880" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;220;190" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="1140" cy="250" r="6" fill="#FF2442" filter="url(#redGlow)">
    <animate attributeName="cx" values="1140;1290;1140" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;260;250" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating code fragments -->
  <g fill="#00d4ff" opacity="0.4" class="mono" font-size="12" font-weight="bold">
    <text x="460" y="255">101</text>
    <text x="610" y="235">{ }</text>
    <text x="900" y="300">JS</text>
    <text x="1060" y="220">H5</text>
  </g>
  
  <!-- Title -->
  <text x="640" y="455" text-anchor="end" fill="#ffffff" class="title" font-size="44" font-weight="800" letter-spacing="2" filter="url(#titleGlow)">WECHAT</text>
  <path d="M675 445 L755 445 L743 435 M755 445 L743 455" class="arrow" stroke-width="4"/>
  <text x="785" y="455" text-anchor="start" fill="#ffffff" class="title" font-size="44" font-weight="800" letter-spacing="2" filter="url(#titleGlow)">XIAOHONGSHU</text>
  
  <text x="650" y="492" text-anchor="end" fill="#00d4ff" class="title" font-size="15" font-weight="600" letter-spacing="3">MINIPROGRAM / GAME</text>
  <path d="M675 485 L735 485 L727 479 M735 485 L727 491" class="arrow" stroke-width="2.5"/>
  <text x="755" y="492" text-anchor="start" fill="#00d4ff" class="title" font-size="15" font-weight="600" letter-spacing="3">MINITOOL MIGRATION ENGINE</text>
  
  <!-- Version badge -->
  <rect x="1430" y="460" width="120" height="34" rx="17" fill="url(#glassGrad)" stroke="#FF2442" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1490" y="482" text-anchor="middle" fill="#ff6b80" class="mono" font-size="14" font-weight="700">v1.0.0</text>
</svg>
