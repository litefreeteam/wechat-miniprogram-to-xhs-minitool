<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="particleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07C160"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#FF2442"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#07C160" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#07C160" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07C160" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2442" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FF2442" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF2442" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', monospace; }
      .arrow { fill: none; stroke: #00d4ff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <ellipse cx="600" cy="200" rx="500" ry="150" fill="url(#particleGrad)" opacity="0.08" filter="url(#glow-cyan)"/>
  
  <g transform="translate(220, 200)" filter="url(#glow-green)">
    <circle cx="0" cy="0" r="70" fill="url(#orbGrad)" opacity="0.3"/>
    <path d="M-45 -10 C-45 -40 -15 -55 20 -55 C55 -55 75 -35 75 -5 C75 20 55 40 25 40 C20 40 15 39 10 37 L-5 50 L-5 35 C-25 30 -45 10 -45 -10 Z" fill="#07C160"/>
    <circle cx="-10" cy="-15" r="5" fill="#0a0f1a"/>
    <circle cx="25" cy="-15" r="5" fill="#0a0f1a"/>
    <path d="M-15 0 Q7.5 15 30 0" stroke="#0a0f1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="0" y="85" text-anchor="middle" fill="#07C160" class="mono" font-size="14" font-weight="bold" opacity="0.9">{ }</text>
  </g>
  
  <g transform="translate(980, 200)" filter="url(#glow-red)">
    <circle cx="0" cy="0" r="70" fill="url(#orbGrad2)" opacity="0.3"/>
    <rect x="-45" y="-55" width="90" height="110" rx="12" fill="#FF2442"/>
    <rect x="-38" y="-48" width="76" height="96" rx="8" fill="#ff4d6d"/>
    <rect x="-30" y="-35" width="60" height="8" rx="4" fill="#fff" opacity="0.9"/>
    <rect x="-30" y="-20" width="45" height="6" rx="3" fill="#fff" opacity="0.6"/>
    <rect x="-30" y="-10" width="50" height="6" rx="3" fill="#fff" opacity="0.6"/>
    <rect x="-30" y="0" width="35" height="6" rx="3" fill="#fff" opacity="0.6"/>
    <text x="0" y="85" text-anchor="middle" fill="#FF2442" class="mono" font-size="14" font-weight="bold" opacity="0.9">H5 · ZIP</text>
  </g>
  
  <path d="M290 200 Q600 120 910 200" stroke="url(#particleGrad)" stroke-width="2" fill="none" opacity="0.4" filter="url(#glow-cyan)"/>
  <path d="M290 200 Q600 280 910 200" stroke="url(#particleGrad)" stroke-width="2" fill="none" opacity="0.3" filter="url(#glow-cyan)"/>
  
  <circle cx="360" cy="170" r="3" fill="#07C160" filter="url(#glow-green)">
    <animate attributeName="cx" values="360;400;360" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="140" r="4" fill="#00d4ff" filter="url(#glow-cyan)">
    <animate attributeName="cy" values="140;160;140" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="240" r="3" fill="#00d4ff" filter="url(#glow-cyan)">
    <animate attributeName="cx" values="680;720;680" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="190" r="4" fill="#FF2442" filter="url(#glow-red)">
    <animate attributeName="cy" values="190;170;190" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <g fill="#00d4ff" opacity="0.5" class="mono" font-size="16" font-weight="bold">
    <text x="420" y="150">&lt;/&gt;</text>
    <text x="580" y="260">Canvas</text>
    <text x="740" y="150">SPA</text>
    <text x="500" y="210">ZIP</text>
  </g>
  
  <text x="415" y="350" text-anchor="end" fill="#ffffff" class="title" font-size="32" font-weight="800" letter-spacing="2">WECHAT</text>
  <path d="M435 342 L485 342 L475 334 M485 342 L475 350" class="arrow"/>
  <text x="505" y="350" text-anchor="start" fill="#ffffff" class="title" font-size="32" font-weight="800" letter-spacing="2">XIAOHONGSHU</text>
  
  <text x="515" y="375" text-anchor="end" fill="#00d4ff" class="title" font-size="14" font-weight="500" letter-spacing="3">MINIPROGRAM / GAME</text>
  <path d="M525 368 L565 368 L558 362 M565 368 L558 374" class="arrow" stroke-width="2"/>
  <text x="575" y="375" text-anchor="start" fill="#00d4ff" class="title" font-size="14" font-weight="500" letter-spacing="3">MINITOOL MIGRATION ENGINE</text>
</svg>
